# Render Infrastructure Blueprint for School ERP Backend
services:
  - type: web
    name: school-erp-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: |
      apt-get update && apt-get install -y chromium --no-install-recommends && rm -rf /var/lib/apt/lists/* && npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://school-erp-frontend.vercel.app,http://localhost:5173
      - key: TRUST_PROXY
        value: true
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: MONGO_URI
        sync: false # Set database string in Render Dashboard UI for security
